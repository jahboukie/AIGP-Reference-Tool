<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="76" y="76" width="360" height="400" rx="12" fill="#0002"/>
  <!-- Back cover -->
  <rect x="80" y="56" width="340" height="400" rx="10" fill="url(#cover)"/>
  <!-- Pages block -->
  <rect x="100" y="66" width="310" height="380" rx="4" fill="url(#pages)"/>
  <!-- Page lines -->
  <line x1="130" y1="120" x2="380" y2="120" stroke="#a0aec0" stroke-width="3"/>
  <line x1="130" y1="155" x2="380" y2="155" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="130" y1="185" x2="350" y2="185" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="130" y1="215" x2="370" y2="215" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="130" y1="245" x2="340" y2="245" stroke="#cbd5e0" stroke-width="2"/>
  <!-- Neural net diagram on page -->
  <circle cx="180" cy="310" r="12" fill="#2b6cb0" opacity="0.7"/>
  <circle cx="180" cy="350" r="12" fill="#2b6cb0" opacity="0.7"/>
  <circle cx="180" cy="390" r="12" fill="#2b6cb0" opacity="0.7"/>
  <circle cx="260" cy="320" r="12" fill="#3182ce" opacity="0.7"/>
  <circle cx="260" cy="370" r="12" fill="#3182ce" opacity="0.7"/>
  <circle cx="340" cy="345" r="12" fill="#4299e1" opacity="0.7"/>
  <line x1="192" y1="310" x2="248" y2="320" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="192" y1="310" x2="248" y2="370" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="192" y1="350" x2="248" y2="320" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="192" y1="350" x2="248" y2="370" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="192" y1="390" x2="248" y2="320" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="192" y1="390" x2="248" y2="370" stroke="#2b6cb0" stroke-width="2" opacity="0.5"/>
  <line x1="272" y1="320" x2="328" y2="345" stroke="#3182ce" stroke-width="2" opacity="0.5"/>
  <line x1="272" y1="370" x2="328" y2="345" stroke="#3182ce" stroke-width="2" opacity="0.5"/>
  <!-- Spine -->
  <rect x="80" y="56" width="18" height="400" rx="4" fill="#1a365d"/>
  <!-- Title on cover -->
  <text x="255" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#1a365d">AI</text>
</svg>
